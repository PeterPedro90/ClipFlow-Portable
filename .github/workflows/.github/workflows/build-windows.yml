
name: Gerar ClipFlow Portable para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Preparar Python no GitHub
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Gerar executavel com FFmpeg e Deno
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Conferir arquivos
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ClipFlow/ClipFlow.exe')) { throw 'ClipFlow.exe nao encontrado' }
          if (!(Test-Path 'dist/ClipFlow/_internal/vendor/ffmpeg.exe')) { throw 'FFmpeg nao incorporado' }
          if (!(Test-Path 'dist/ClipFlow/_internal/vendor/deno.exe')) { throw 'Deno nao incorporado' }

      - name: Empacotar aplicativo
        shell: pwsh
        run: Compress-Archive -Path 'dist/ClipFlow' -DestinationPath 'ClipFlow-Windows-Portable.zip' -Force

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-Windows-Portable
          path: ClipFlow-Windows-Portable.zip
          retention-days: 30
